# NF-CSE-CIC-IDS2018-v3 (captured on AWS). Large file: set data.max_rows while debugging,
# and consider window_seconds: 30 if some windows hold too many flows for GPU memory.
name: nf_cse_cic_ids2018_v3
output_dir: runs/cic2018
data:
  csv: data/NF-CSE-CIC-IDS2018-v3.csv
  time_col: FLOW_START_MILLISECONDS
  time_unit: ms
  label_col: Attack
  benign_label: Benign
  max_rows: null
  # Every attack class runs in one short episode on one day, so a global chronological cut leaves
  # whole classes out of train or test. Blocked split instead: in every 30-window (30 min) block the
  # first 70% of windows -> train, next 15% -> val, last 15% -> test (21/5/4 windows).
  split_block_windows: 30
graph:
  window_seconds: 60
  history_k: 6
train:
  epochs: 30
